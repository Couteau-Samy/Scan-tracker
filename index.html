<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Scans — Manga Tracker</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-sidebar: #1a1a1e;
            --bg-card: #222226;
            --accent: #00b4d8;
            --accent-hover: #0096b6;
            --green: #2a9d8f;
            --red: #e63946;
            --text-main: #f0f0f0;
            --text-muted: #a0a0ab;
            --border: #33333a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        .app-container {
            display: flex;
            width: 100vw;
            min-height: 100vh;
        }

        @media (max-width: 768px) {
            .app-container {
                flex-direction: column;
            }
        }

        .sidebar {
            width: 320px;
            background-color: var(--bg-sidebar);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }
        }

        h2 {
            color: var(--accent);
            font-size: 1.3rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .btn {
            padding: 12px 18px;
            background-color: var(--accent);
            border: none;
            color: #fff;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .content {
                padding: 20px;
            }
        }

        .manga-grid {
            margin-top: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .manga-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .manga-card:hover {
            border-color: #444450;
        }

        .manga-card.editing {
            border-color: var(--accent);
        }

        .manga-info h3 {
            color: var(--text-main);
            font-size: 1.2rem;
            margin-bottom: 6px;
        }

        .badges-container {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .chapter-badge {
            background: #2b2b36;
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .page-badge {
            background: #2b2b36;
            color: #e9c46a;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .manga-info .url-preview {
            font-size: 0.8rem;
            color: var(--text-muted);
            word-break: break-all;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 14px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            user-select: none;
        }

        .status-checkbox input {
            width: 18px;
            height: 18px;
            accent-color: var(--green);
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
        }

        .btn-read {
            background-color: var(--green);
            color: white;
            font-weight: 600;
        }

        .btn-read:hover {
            background-color: #21867a;
        }

        .btn-edit {
            background-color: #3a3a46;
            color: var(--text-main);
        }

        .btn-edit:hover {
            background-color: #484857;
        }

        .btn-delete {
            background-color: transparent;
            color: var(--red);
            border: 1px solid rgba(230, 57, 70, 0.3);
        }

        .btn-delete:hover {
            background-color: var(--red);
            color: white;
        }

        .edit-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .empty-state {
            color: var(--text-muted);
            text-align: center;
            margin-top: 60px;
            font-size: 1.1rem;
        }

        .error-state {
            color: var(--red);
            text-align: center;
            margin-top: 60px;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="sidebar">
            <h2>📖 Nouveau Scan</h2>
            <div class="form-group">
                <label for="mangaName">Manga</label>
                <input type="text" id="mangaName" placeholder="Ex: Kingdom">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="mangaChapter">Chapitre</label>
                    <input type="text" id="mangaChapter" placeholder="Ex: 831">
                </div>
                <div class="form-group">
                    <label for="mangaPage">Page</label>
                    <input type="number" id="mangaPage" placeholder="Ex: 14" min="1">
                </div>
            </div>
            <div class="form-group">
                <label for="mangaUrl">Lien du Scan</label>
                <input type="url" id="mangaUrl" placeholder="https://sushiscan.net/...">
            </div>
            <button id="addBtn" class="btn">🚀 Enregistrer</button>
        </div>

        <div class="content">
            <h2>Mes Lectures en cours</h2>
            <div class="manga-grid" id="mangaGrid">
                <p class="empty-state">Connexion à Firebase en cours...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getDatabase, 
            ref, 
            push, 
            onValue, 
            update, 
            remove 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvxEVUS0Av-BmyJ2JxH3sri7-fAI0BCQk",
            authDomain: "scan-hihi.firebaseapp.com",
            databaseURL: "https://scan-hihi-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "scan-hihi",
            storageBucket: "scan-hihi.firebasestorage.app",
            messagingSenderId: "7375315107",
            appId: "1:7375315107:web:7fb05a0aef21fa7309df16",
            measurementId: "G-YGVV55MFS3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const scansRef = ref(db, 'scans');

        const mangaNameInput = document.getElementById('mangaName');
        const mangaChapterInput = document.getElementById('mangaChapter');
        const mangaPageInput = document.getElementById('mangaPage');
        const mangaUrlInput = document.getElementById('mangaUrl');
        const mangaGrid = document.getElementById('mangaGrid');
        const addBtn = document.getElementById('addBtn');

        onValue(scansRef, (snapshot) => {
            mangaGrid.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                mangaGrid.innerHTML = '<p class="empty-state">Aucun chapitre enregistré pour le moment.</p>';
                return;
            }

            Object.keys(data).forEach((id) => {
                const item = data[id];
                const card = document.createElement('div');
                card.className = 'manga-card';
                card.id = `card-${id}`;

                const pageDisplay = item.page ? `<span class="page-badge">📄 Page ${escapeHtml(item.page.toString())}</span>` : '';

                card.innerHTML = `
                    <div class="card-content" id="view-${id}">
                        <div class="manga-info">
                            <h3>${escapeHtml(item.name)}</h3>
                            <div class="badges-container">
                                <span class="chapter-badge">Chap. ${escapeHtml(item.chapter)}</span>
                                ${pageDisplay}
                            </div>
                            <p class="url-preview">${escapeHtml(item.url)}</p>
                        </div>
                        <div class="card-actions">
                            <label class="status-checkbox">
                                <input type="checkbox" ${item.read ? 'checked' : ''} data-id="${id}" class="toggle-read">
                                ${item.read ? '✅ Lu' : '⏳ À lire'}
                            </label>
                            <div class="btn-group">
                                <a href="${escapeHtml(item.url)}" target="_blank" class="btn btn-sm btn-read" data-id="${id}">Lire ↗</a>
                                <button class="btn btn-sm btn-edit" data-id="${id}">✏️</button>
                                <button class="btn btn-sm btn-delete" data-id="${id}">🗑️</button>
                            </div>
                        </div>
                    </div>

                    <div class="edit-form" id="edit-${id}" style="display: none;">
                        <input type="text" id="edit-name-${id}" value="${escapeHtml(item.name)}" placeholder="Manga">
                        <div class="form-row">
                            <input type="text" id="edit-chapter-${id}" value="${escapeHtml(item.chapter)}" placeholder="Chapitre">
                            <input type="number" id="edit-page-${id}" value="${item.page ? escapeHtml(item.page.toString()) : ''}" placeholder="Page">
                        </div>
                        <input type="url" id="edit-url-${id}" value="${escapeHtml(item.url)}" placeholder="Lien">
                        <div class="btn-group" style="margin-top: 8px;">
                            <button class="btn btn-sm btn-read save-edit" data-id="${id}">Enregistrer</button>
                            <button class="btn btn-sm btn-edit cancel-edit" data-id="${id}">Annuler</button>
                        </div>
                    </div>
                `;

                mangaGrid.appendChild(card);
            });

            attachEvents();
        }, (error) => {
            console.error("Erreur Firebase :", error);
            mangaGrid.innerHTML = `
                <div class="error-state">
                    <p>⚠️ Impossible d'accéder à la base de données.</p>
                    <small>Vérifiez les règles de sécurité (Rules) dans votre console Firebase Realtime Database.</small>
                </div>`;
        });

        addBtn.addEventListener('click', () => {
            const name = mangaNameInput.value.trim();
            const chapter = mangaChapterInput.value.trim();
            const page = mangaPageInput.value.trim();
            const url = mangaUrlInput.value.trim();

            if (!name || !chapter || !url) {
                alert('Veuillez remplir au moins le nom, le chapitre et le lien.');
                return;
            }

            push(scansRef, {
                name,
                chapter,
                page: page || null,
                url,
                read: false,
                timestamp: Date.now()
            }).catch(err => alert("Erreur lors de l'ajout : " + err.message));

            mangaChapterInput.value = '';
            mangaPageInput.value = '';
            mangaUrlInput.value = '';
        });

        function attachEvents() {
            document.querySelectorAll('.toggle-read').forEach(cb => {
                cb.addEventListener('change', (e) => {
                    const id = e.target.dataset.id;
                    update(ref(db, `scans/${id}`), { read: e.target.checked });
                });
            });

            document.querySelectorAll('.btn-read[target="_blank"]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    update(ref(db, `scans/${id}`), { read: true });
                });
            });

            document.querySelectorAll('.btn-edit').forEach(btn => {
                if (btn.classList.contains('cancel-edit')) return;
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    document.getElementById(`view-${id}`).style.display = 'none';
                    document.getElementById(`edit-${id}`).style.display = 'flex';
                    document.getElementById(`card-${id}`).classList.add('editing');
                });
            });

            document.querySelectorAll('.cancel-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    document.getElementById(`view-${id}`).style.display = 'block';
                    document.getElementById(`edit-${id}`).style.display = 'none';
                    document.getElementById(`card-${id}`).classList.remove('editing');
                });
            });

            document.querySelectorAll('.save-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    const name = document.getElementById(`edit-name-${id}`).value.trim();
                    const chapter = document.getElementById(`edit-chapter-${id}`).value.trim();
                    const page = document.getElementById(`edit-page-${id}`).value.trim();
                    const url = document.getElementById(`edit-url-${id}`).value.trim();

                    if (!name || !chapter || !url) {
                        alert('Le nom, le chapitre et le lien ne peuvent pas être vides.');
                        return;
                    }

                    update(ref(db, `scans/${id}`), { 
                        name, 
                        chapter, 
                        page: page || null, 
                        url 
                    });
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = e.target.dataset.id;
                    if (confirm('Voulez-vous vraiment supprimer ce scan ?')) {
                        remove(ref(db, `scans/${id}`));
                    }
                });
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
