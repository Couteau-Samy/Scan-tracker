<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suivi de Lectures - Firebase</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 320px;
            background-color: #262626;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #404040;
        }
        .content {
            flex: 1;
            background-color: #0d0d0d;
            padding: 20px;
            overflow-y: auto;
        }
        h2 { color: #00b4d8; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: #aaa; }
        input {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 1px solid #404040;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input:focus { border-color: #00b4d8; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00b4d8;
            border: none;
            color: #fff;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #0096b6; }
        
        .manga-list {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .manga-card {
            background: #262626;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .manga-info h3 { margin: 0 0 5px 0; color: #00b4d8; }
        .manga-info p { margin: 0 0 15px 0; font-size: 0.85em; color: #aaa; word-break: break-all; }
        .manga-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #404040;
            padding-top: 10px;
        }
        .status-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }
        .status-checkbox input { width: auto; cursor: pointer; }
        .btn-read {
            background-color: #2a9d8f;
            padding: 6px 12px;
            width: auto;
            font-size: 0.9em;
            text-decoration: none;
            color: white;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn-read:hover { background-color: #21867a; }
        .btn-delete {
            background: none;
            border: none;
            color: #ff4d4d;
            cursor: pointer;
            width: auto;
            padding: 0;
            font-size: 0.9em;
        }
        .btn-delete:hover { text-decoration: underline; }
        .loading { color: #666; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Ajouter un Scan</h2>
        <div class="form-group">
            <label>Nom du Manga</label>
            <input type="text" id="mangaName" placeholder="Ex: Kingdom">
        </div>
        <div class="form-group">
            <label>Numéro ou titre du Chapitre</label>
            <input type="text" id="mangaChapter" placeholder="Ex: Chapitre 831">
        </div>
        <div class="form-group">
            <label>Lien du scan</label>
            <input type="text" id="mangaUrl" placeholder="https://sushiscan.net/...">
        </div>
        <button id="addBtn">➕ Enregistrer</button>
    </div>

    <div class="content">
        <h2>Mes Chapitres Sauvegardés (Cloud)</h2>
        <div class="manga-list" id="mangaListContainer">
            <p class="loading">Connexion à Firebase...</p>
        </div>
    </div>

    <!-- SDK Firebase Modules (v10+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            onSnapshot, 
            updateDoc, 
            deleteDoc, 
            doc, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // configuration de votre projet Firebase
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "VOTRE_AUTH_DOMAIN",
            projectId: "VOTRE_PROJECT_ID",
            storageBucket: "VOTRE_STORAGE_BUCKET",
            messagingSenderId: "VOTRE_MESSAGING_SENDER_ID",
            appId: "VOTRE_APP_ID"
        };

        // Initialisation de Firebase et Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const lecturesCollection = collection(db, "lectures");

        const nameInput = document.getElementById('mangaName');
        const chapterInput = document.getElementById('mangaChapter');
        const urlInput = document.getElementById('mangaUrl');
        const listContainer = document.getElementById('mangaListContainer');

        // Écoute en temps réel des changements dans Firestore
        const q = query(lecturesCollection, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            listContainer.innerHTML = '';
            
            if (snapshot.empty) {
                listContainer.innerHTML = '<p style="color: #666;">Aucun chapitre enregistré dans la base.</p>';
                return;
            }

            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;

                const card = document.createElement('div');
                card.className = 'manga-card';
                card.innerHTML = `
                    <div class="manga-info">
                        <h3>${item.name}</h3>
                        <strong style="color: #aaa; font-size: 0.9em;">${item.chapter}</strong>
                        <p>${item.url}</p>
                    </div>
                    <div class="manga-actions">
                        <label class="status-checkbox">
                            <input type="checkbox" ${item.read ? 'checked' : ''} data-id="${id}" class="toggle-read">
                            ${item.read ? '✅ Lu' : '⏳ À lire'}
                        </label>
                        <a href="${item.url}" target="_blank" class="btn-read" data-id="${id}">Lire ↗</a>
                        <button class="btn-delete" data-id="${id}">Supprimer</button>
                    </div>
                `;
                listContainer.appendChild(card);
            });

            // Ajout des événements sur les éléments générés
            document.querySelectorAll('.toggle-read').forEach(cb => {
                cb.addEventListener('change', (e) => toggleRead(e.target.dataset.id, e.target.checked));
            });
            document.querySelectorAll('.btn-read').forEach(btn => {
                btn.addEventListener('click', (e) => markAsRead(e.target.dataset.id));
            });
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => deleteLecture(e.target.dataset.id));
            });
        });

        // Ajouter un document dans Firestore
        document.getElementById('addBtn').addEventListener('click', async () => {
            const name = nameInput.value.trim();
            const chapter = chapterInput.value.trim();
            const url = urlInput.value.trim();

            if (!name || !chapter || !url) {
                alert('Veuillez remplir tous les champs.');
                return;
            }

            try {
                await addDoc(lecturesCollection, {
                    name: name,
                    chapter: chapter,
                    url: url,
                    read: false,
                    createdAt: new Date()
                });

                chapterInput.value = '';
                urlInput.value = '';
            } catch (error) {
                console.error("Erreur d'ajout Firestore :", error);
            }
        });

        // Modifier le statut Lu/À lire
        async function toggleRead(id, isChecked) {
            const docRef = doc(db, "lectures", id);
            await updateDoc(docRef, { read: isChecked });
        }

        // Marquer comme lu au clic sur le lien externe
        async function markAsRead(id) {
            const docRef = doc(db, "lectures", id);
            await updateDoc(docRef, { read: true });
        }

        // Supprimer de la base
        async function deleteLecture(id) {
            if (confirm('Supprimer ce chapitre de Firebase ?')) {
                const docRef = doc(db, "lectures", id);
                await deleteDoc(docRef);
            }
        }
    </script>
</body>
</html>
